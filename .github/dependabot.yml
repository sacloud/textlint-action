version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "00:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "00:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "00:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "ci:"
    cooldown:
      default-days: 7
